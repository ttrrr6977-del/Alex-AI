<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alex AI Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: 'rgba(15, 23, 42, 0.75)',
                        borderGlow: 'rgba(6, 182, 212, 0.3)',
                        neonCyan: '#06b6d4',
                        neonPurple: '#a855f7'
                    },
                    boxShadow: {
                        'neon-cyan': '0 0 15px rgba(6, 182, 212, 0.4)',
                        'neon-purple': '0 0 15px rgba(168, 85, 247, 0.4)'
                    }
                }
            }
        }
    </script>
    <style>
        /* Hide scrollbars for clean app presentation */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Custom animation pulses */
        @keyframes subtlePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }
        .pulse-subtle { animation: subtlePulse 3s infinite ease-in-out; }

        /* Rendered markdown formatting */
        .markdown-body code {
            background-color: rgba(30, 41, 59, 0.8);
            color: #38bdf8;
            padding: 0.15rem 0.4rem;
            border-radius: 0.375rem;
            font-size: 0.85em;
            font-family: monospace;
        }
        .markdown-body pre {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 0.75rem;
            margin: 0.5rem 0;
            overflow-x: auto;
        }
        .markdown-body pre code {
            background-color: transparent;
            color: #f1f5f9;
            padding: 0;
        }
        .markdown-body p { margin-bottom: 0.5rem; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin: 0.5rem 0; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.25rem; margin: 0.5rem 0; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 h-full w-full flex flex-col font-sans antialiased select-none overflow-hidden touch-manipulation">

    <!-- App Header -->
    <header class="bg-cardBg backdrop-blur-xl border-b border-slate-800/80 px-4 py-3 flex items-center justify-between z-20 shrink-0 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="relative flex items-center justify-center w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 shadow-neon-cyan">
                <i class="fa-solid font-bold text-white text-sm">A</i>
                <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-500 border-2 border-darkBg rounded-full animate-ping"></span>
                <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-500 border-2 border-darkBg rounded-full"></span>
            </div>
            <div>
                <div class="flex items-center space-x-1.5">
                    <h1 class="text-base font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-purple-400">ALEX AI</h1>
                    <span class="bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-[10px] px-1.5 py-0.5 rounded font-mono font-medium">v2.0</span>
                </div>
                <p class="text-[11px] text-slate-400 flex items-center gap-1">
                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Ready to answer anything
                </p>
            </div>
        </div>

        <!-- Actions & Model Switcher -->
        <div class="flex items-center space-x-2">
            <div class="relative">
                <select id="model-select" class="bg-slate-900/90 border border-slate-700/80 text-slate-300 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-cyan-500 appearance-none pr-6 cursor-pointer">
                    <option value="google/gemini-flash-1.5">Gemini 1.5 Flash</option>
                    <option value="deepseek/deepseek-chat">DeepSeek V3</option>
                    <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B (Free)</option>
                </select>
                <i class="fa-solid fa-chevron-down absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 pointer-events-none"></i>
            </div>
            <button onclick="clearHistory()" class="w-8 h-8 rounded-lg border border-slate-800 bg-slate-900/60 hover:bg-slate-800 text-slate-400 hover:text-red-400 flex items-center justify-center transition" title="Clear Chat">
                <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
        </div>
    </header>

    <!-- Chat Messages Scroll Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar relative z-10">
        <!-- Messages dynamically rendered here -->
    </main>

    <!-- Suggestion Chips Bar -->
    <div id="suggestions-bar" class="px-4 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar shrink-0 border-t border-slate-800/40 bg-slate-950/40">
        <button onclick="sendQuickPrompt('Explain Quantum Computing simply')" class="shrink-0 bg-slate-800/60 border border-slate-700/50 hover:border-cyan-500/50 text-slate-300 text-xs px-3 py-1.5 rounded-full transition flex items-center gap-1.5">
            <i class="fa-solid fa-atom text-cyan-400"></i> Quantum Computing
        </button>
        <button onclick="sendQuickPrompt('Write a clean Python script to scrape HTML')" class="shrink-0 bg-slate-800/60 border border-slate-700/50 hover:border-cyan-500/50 text-slate-300 text-xs px-3 py-1.5 rounded-full transition flex items-center gap-1.5">
            <i class="fa-solid fa-code text-purple-400"></i> Python Code
        </button>
        <button onclick="sendQuickPrompt('Give me 5 creative business startup ideas for 2026')" class="shrink-0 bg-slate-800/60 border border-slate-700/50 hover:border-cyan-500/50 text-slate-300 text-xs px-3 py-1.5 rounded-full transition flex items-center gap-1.5">
            <i class="fa-solid fa-lightbulb text-amber-400"></i> Startup Ideas
        </button>
        <button onclick="sendQuickPrompt('Help me write a professional email to my team')" class="shrink-0 bg-slate-800/60 border border-slate-700/50 hover:border-cyan-500/50 text-slate-300 text-xs px-3 py-1.5 rounded-full transition flex items-center gap-1.5">
            <i class="fa-solid fa-paper-plane text-emerald-400"></i> Draft Email
        </button>
    </div>

    <!-- Mobile App Bottom Dock & Form -->
    <footer class="bg-cardBg backdrop-blur-xl border-t border-slate-800/80 p-3 shrink-0 z-20">
        <form id="chat-form" onsubmit="handleSubmit(event)" class="max-w-3xl mx-auto flex items-center gap-2">
            <div class="relative flex-1">
                <textarea 
                    id="user-input" 
                    rows="1"
                    placeholder="Ask Alex AI anything..." 
                    class="w-full bg-slate-900/90 border border-slate-700/70 text-slate-100 placeholder-slate-500 text-sm rounded-2xl pl-4 pr-10 py-3 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition shadow-inner resize-none max-h-28"
                    onkeydown="handleKeyDown(event)"
                    oninput="autoResizeTextarea(this)"></textarea>
            </div>
            <button 
                type="submit" 
                id="send-btn" 
                class="w-11 h-11 rounded-2xl bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-medium flex items-center justify-center transition shadow-neon-cyan shrink-0 active:scale-95 disabled:opacity-50 disabled:pointer-events-none">
                <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
        </form>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-slate-800 border border-cyan-500/40 text-cyan-300 text-xs px-4 py-2 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-text">Copied to clipboard!</span>
    </div>

    <script>
        // Secure API Proxy Endpoint (calls your backend server instead of OpenRouter directly)
        const API_URL = "/api/chat";
        
        // System Prompt defining Alex AI personality
        const SYSTEM_PROMPT = {
            role: "system",
            content: "You are Alex AI, an extremely intelligent, helpful, friendly, versatile, and fast AI assistant capable of answering all questions clearly, accurately, and concisely."
        };

        // Message history state
        let messagesHistory = [SYSTEM_PROMPT];
        let isGenerating = false;

        // Initialize application on load
        window.addEventListener('DOMContentLoaded', () => {
            loadHistoryFromStorage();
            if (messagesHistory.length <= 1) {
                renderWelcomeMessage();
            } else {
                renderAllMessages();
            }
        });

        // Handle Form Submission reliably across mobile & desktop
        function handleSubmit(e) {
            e.preventDefault();
            if (isGenerating) return;

            const inputElem = document.getElementById('user-input');
            const userText = inputElem.value.trim();

            if (!userText) return;

            // Reset textarea height & clear input
            inputElem.value = '';
            inputElem.style.height = 'auto';

            // Process message
            processUserMessage(userText);
        }

        // Keyboard handler for 'Enter' key sending (Shift+Enter for new line)
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('chat-form').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
            }
        }

        // Send via quick suggestion chips
        function sendQuickPrompt(promptText) {
            if (isGenerating) return;
            processUserMessage(promptText);
        }

        // Process logic for sending message and fetching AI reply
        async function processUserMessage(userText) {
            isGenerating = true;
            updateSendButtonState(true);

            // Hide initial suggestions bar to maximize viewing space
            document.getElementById('suggestions-bar').classList.add('hidden');

            // 1. Add User Message to State & DOM
            const userMsgObj = { role: "user", content: userText };
            messagesHistory.push(userMsgObj);
            appendMessageToDOM('user', userText);
            saveHistoryToStorage();

            // 2. Add Thinking / Loading Bubble
            const loadingId = 'loading-' + Date.now();
            appendLoadingDOM(loadingId);
            scrollToBottom();

            // 3. Fetch Response from Your Backend Proxy
            const selectedModel = document.getElementById('model-select').value;
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                        // No Authorization header needed here anymore! The backend adds it securely.
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: messagesHistory
                    })
                });

                removeElementDOM(loadingId);

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `HTTP Error ${response.status}`);
                }

                const data = await response.json();
                const aiReply = data.choices?.[0]?.message?.content || "I apologize, but I couldn't generate a response. Please try again.";

                // 4. Save Assistant Response & Render
                messagesHistory.push({ role: "assistant", content: aiReply });
                appendMessageToDOM('assistant', aiReply);
                saveHistoryToStorage();

            } catch (error) {
                console.error("API Error:", error);
                removeElementDOM(loadingId);
                
                const errorMessage = `**Connection Alert:** Couldn't connect to backend server.\n\n*Details:* ${error.message}\n\nPlease verify your server is running or check your environment configuration.`;
                appendMessageToDOM('assistant', errorMessage, true);
            } finally {
                isGenerating = false;
                updateSendButtonState(false);
                scrollToBottom();
            }
        }

        // Render Welcome Screen
        function renderWelcomeMessage() {
            const container = document.getElementById('chat-container');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center text-center py-10 px-4 space-y-4 pulse-subtle">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center shadow-neon-cyan">
                        <i class="fa-solid fa-robot text-3xl text-white"></i>
                    </div>
                    <div class="max-w-xs">
                        <h2 class="text-xl font-bold text-white mb-1">Meet Alex AI</h2>
                        <p class="text-xs text-slate-400">Your personal intelligent mobile assistant. Ask questions, generate code, write emails, or brainstorm ideas anytime.</p>
                    </div>
                </div>
            `;
        }

        // Append Single Message Bubble to DOM
        function appendMessageToDOM(role, content, isError = false) {
            const container = document.getElementById('chat-container');

            // Clear welcome graphic if present
            if (container.querySelector('.pulse-subtle')) {
                container.innerHTML = '';
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex items-start gap-2.5 ${role === 'user' ? 'justify-end' : 'justify-start'}`;

            const formattedHtml = role === 'assistant' ? marked.parse(content) : escapeHtml(content).replace(/\n/g, '<br>');

            if (role === 'user') {
                msgDiv.innerHTML = `
                    <div class="bg-gradient-to-r from-cyan-600 to-blue-600 text-white px-4 py-3 rounded-2xl rounded-tr-xs max-w-[85%] text-sm shadow-md break-words">
                        ${formattedHtml}
                    </div>
                `;
            } else {
                const uniqueId = 'msg-' + Date.now() + Math.random().toString(36).substr(2, 4);
                msgDiv.innerHTML = `
                    <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center text-[10px] font-bold text-white shrink-0 mt-1 shadow-neon-cyan">
                        AI
                    </div>
                    <div class="relative group max-w-[85%]">
                        <div class="bg-slate-800/90 border ${isError ? 'border-red-500/50 text-red-200' : 'border-slate-700/70 text-slate-200'} backdrop-blur-md px-4 py-3 rounded-2xl rounded-tl-xs text-sm shadow-md markdown-body break-words">
                            ${formattedHtml}
                        </div>
                        <div class="flex items-center gap-2 mt-1 px-1">
                            <button onclick="copyToClipboard(this, \`${escapeForDataAttr(content)}\`)" class="text-[11px] text-slate-500 hover:text-cyan-400 transition flex items-center gap-1">
                                <i class="fa-regular fa-copy"></i> Copy
                            </button>
                        </div>
                    </div>
                `;
            }

            container.appendChild(msgDiv);
            scrollToBottom();
        }

        // Loading Bubble DOM
        function appendLoadingDOM(loadingId) {
            const container = document.getElementById('chat-container');
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.className = "flex items-start gap-2.5 justify-start";
            loadingDiv.innerHTML = `
                <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center text-[10px] font-bold text-white shrink-0 mt-1">
                    AI
                </div>
                <div class="bg-slate-800/90 border border-slate-700/70 backdrop-blur-md px-4 py-3 rounded-2xl rounded-tl-xs text-xs text-slate-400 flex items-center gap-2 shadow-md">
                    <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                    <span class="animate-pulse">Alex is thinking...</span>
                </div>
            `;
            container.appendChild(loadingDiv);
        }

        function removeElementDOM(id) {
            const elem = document.getElementById(id);
            if (elem) elem.remove();
        }

        // Auto-scroll to bottom of chat feed
        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        // Auto-resize input textarea up to max-height
        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 112) + 'px';
        }

        // Toggle send button state during generation
        function updateSendButtonState(loading) {
            const btn = document.getElementById('send-btn');
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-sm"></i>`;
            } else {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-paper-plane text-sm"></i>`;
            }
        }

        // Clear Chat History
        function clearHistory() {
            if (confirm("Clear chat conversation history?")) {
                messagesHistory = [SYSTEM_PROMPT];
                localStorage.removeItem('alex_ai_messages');
                renderWelcomeMessage();
                document.getElementById('suggestions-bar').classList.remove('hidden');
                showToast("Chat cleared");
            }
        }

        // Copy response to clipboard
        function copyToClipboard(buttonElem, text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            }

            buttonElem.classList.add('text-cyan-400');
            showToast("Copied to clipboard!");

            setTimeout(() => {
                buttonElem.classList.remove('text-cyan-400');
            }, 2000);
        }

        // Show Toast Feedback
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        // Storage Persistence Helpers
        function saveHistoryToStorage() {
            try {
                localStorage.setItem('alex_ai_messages', JSON.stringify(messagesHistory));
            } catch (e) {
                console.warn("LocalStorage save failed:", e);
            }
        }

        function loadHistoryFromStorage() {
            try {
                const saved = localStorage.getItem('alex_ai_messages');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        messagesHistory = parsed;
                    }
                }
            } catch (e) {
                console.warn("LocalStorage read failed:", e);
            }
        }

        function renderAllMessages() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            
            for (let i = 1; i < messagesHistory.length; i++) {
                const msg = messagesHistory[i];
                appendMessageToDOM(msg.role, msg.content);
            }
            if (messagesHistory.length > 1) {
                document.getElementById('suggestions-bar').classList.add('hidden');
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function escapeForDataAttr(text) {
            return text.replace(/`/g, '\\`').replace(/\$/g, '\\$');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alex AI - Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        panelBg: 'rgba(17, 24, 39, 0.8)',
                        neonCyan: '#06b6d4',
                        neonPurple: '#a855f7'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 h-[100dvh] flex flex-col justify-between overflow-hidden">

    <!-- Header -->
    <header class="bg-panelBg backdrop-blur-md border-b border-gray-800 p-4 flex items-center justify-between shadow-lg z-10">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-neonCyan rounded-full animate-pulse shadow-[0_0_10px_#06b6d4]"></div>
            <div>
                <h1 class="text-base font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">ALEX AI</h1>
                <p class="text-[10px] text-gray-400">Ready to chat</p>
            </div>
        </div>
        <button onclick="clearChat()" class="text-xs bg-gray-800/80 hover:bg-gray-700 text-gray-300 border border-gray-700 px-3 py-1.5 rounded-lg transition">Clear</button>
    </header>

    <!-- Chat Container -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <div class="flex items-start space-x-3">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center text-xs font-bold shadow-[0_0_10px_rgba(6,182,212,0.5)] shrink-0">AI</div>
            <div class="bg-gray-800/90 border border-gray-700/60 backdrop-blur-md p-3.5 rounded-2xl max-w-[85%] text-sm text-gray-200 shadow-md leading-relaxed">
                Hello! I'm **Alex AI**. Ask me anything, and I'll answer it for you!
            </div>
        </div>
    </div>

    <!-- Input Area Form -->
    <form id="chat-form" onsubmit="handleSend(event)" class="bg-panelBg backdrop-blur-md border-t border-gray-800 p-3 z-10">
        <div class="max-w-2xl mx-auto flex items-center space-x-2">
            <input type="text" id="user-input" placeholder="Ask Alex AI anything..." autocomplete="off"
                class="flex-1 bg-gray-900/90 border border-gray-700 text-gray-100 text-sm rounded-xl px-4 py-3.5 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition shadow-inner">
            <button type="submit" id="send-btn" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white px-5 py-3.5 rounded-xl text-sm font-medium transition shadow-[0_0_15px_rgba(6,182,212,0.4)] flex items-center justify-center shrink-0">
                Send
            </button>
        </div>
    </form>

    <!-- Script Logic -->
    <script>
        // Obfuscated Key Buffer
        const _k = [115,107,45,111,114,45,118,49,45,54,52,101,100,97,56,101,97,100,57,56,52,49,49,102,99,101,56,52,102,48,51,50,98,97,52,99,50,48,97,51,51,97,53,49,54,56,100,49,55,98,97,50,97,97,98,54,101,49,57,97,99,52,49,101,99,98,55,53,55,55,54,50];
        const getKey = () => String.fromCharCode(..._k);

        async function handleSend(event) {
            event.preventDefault();
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const prompt = inputField.value.trim();

            if (!prompt) return;

            // Append User Message
            chatContainer.innerHTML += `
                <div class="flex items-start justify-end space-x-3">
                    <div class="bg-gradient-to-r from-cyan-600 to-blue-600 text-white p-3.5 rounded-2xl max-w-[85%] text-sm shadow-md leading-relaxed">
                        ${escapeHtml(prompt)}
                    </div>
                </div>`;
            
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Loading indicator
            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center text-xs font-bold shrink-0">AI</div>
                    <div class="bg-gray-800/90 border border-gray-700/65 p-3.5 rounded-2xl text-sm text-gray-400 animate-pulse">
                        Thinking...
                    </div>
                </div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getKey()}`
                    },
                    body: JSON.stringify({
                        model: "deepseek/deepseek-chat",
                        messages: [{ role: "user", content: prompt }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.error) {
                    chatContainer.innerHTML += `
                        <div class="flex items-start space-x-3">
                            <div class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center text-xs font-bold shrink-0">!</div>
                            <div class="bg-red-950/80 border border-red-800 p-3.5 rounded-2xl max-w-[85%] text-sm text-red-200">
                                ${escapeHtml(data.error.message || 'Error connecting to AI.')}
                            </div>
                        </div>`;
                } else {
                    const aiReply = data.choices?.[0]?.message?.content || "No response received.";
                    chatContainer.innerHTML += `
                        <div class="flex items-start space-x-3">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center text-xs font-bold shadow-[0_0_10px_rgba(6,182,212,0.5)] shrink-0">AI</div>
                            <div class="bg-gray-800/90 border border-gray-700/60 backdrop-blur-md p-3.5 rounded-2xl max-w-[85%] text-sm text-gray-200 shadow-md leading-relaxed">
                                ${formatMarkdown(aiReply)}
                            </div>
                        </div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `<div class="text-red-400 text-xs text-center py-2">Connection failed. Check your network.</div>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function clearChat() {
            document.getElementById('chat-container').innerHTML = `
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center text-xs font-bold shadow-[0_0_10px_rgba(6,182,212,0.5)] shrink-0">AI</div>
                    <div class="bg-gray-800/90 border border-gray-700/60 backdrop-blur-md p-3.5 rounded-2xl max-w-[85%] text-sm text-gray-200 shadow-md leading-relaxed">
                        Chat cleared. What would you like to ask next?
                    </div>
                </div>`;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatMarkdown(text) {
            return escapeHtml(text).replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
